name: Nightly checks

# runs every day at midnight
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  # To test fixes on push rather than wait for the scheduling
  push:
    branches:
      - fix/nightly

jobs:
  assert_test_runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (for pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Get current version of Storybook
        run: |
          echo "prev_storybook_version=$(pnpm list storybook --depth=0 | grep 'storybook@' | awk -F'@' '{print $2}')" >> $GITHUB_ENV
          echo "prev_storybook_framework_version=$(pnpm list @storybook/react-vite --depth=0 | grep '@storybook/react-vite@' | awk -F'@' '{print $3}')" >> $GITHUB_ENV

      - name: Upgrade to storybook@next
        run: |
          npx storybook@next upgrade --yes

      - name: Run test runner
        uses: mathiasvr/command-output@v2.0.0
        id: tests
        with:
          run: |
            pnpm build
            pnpm test-storybook:ci

      - name: Get prerelease version of Storybook
        if: ${{ failure() }}
        run: |
          echo "storybook_version=$(pnpm list storybook --depth=0 | grep 'storybook@' | awk -F'@' '{print $2}')" >> $GITHUB_ENV
          echo "storybook_framework_version=$(pnpm list @storybook/react-vite --depth=0 | grep '@storybook/react-vite@' | awk -F'@' '{print $3}')" >> $GITHUB_ENV

      - name: Report incoming errors
        if: ${{ failure() }}
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: '${{ secrets.SLACK_CHANNEL_ID }}'
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":storybook: :runner: [Test Runner] The Nightly check has failed :alert:",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*storybook version:*\n${{ env.prev_storybook_version }} >> ${{ env.storybook_version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*@storybook/react-vite version:*\n${{ env.prev_storybook_framework_version }} >> ${{ env.storybook_framework_version }}"
                    }
                  ],
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View failure",
                      "emoji": true
                    },
                    "value": "view_failure",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "action_id": "button-action"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  assert_test_runner_failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (for pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Get current version of Storybook
        run: |
          echo "prev_storybook_version=$(pnpm list storybook --depth=0 | grep 'storybook@' | awk -F'@' '{print $2}')" >> $GITHUB_ENV
          echo "prev_storybook_framework_version=$(pnpm list @storybook/react-vite --depth=0 | grep '@storybook/react-vite@' | awk -F'@' '{print $3}')" >> $GITHUB_ENV

      - name: Upgrade to storybook@next
        run: |
          npx storybook@next upgrade --prerelease --yes

      - name: Run test runner and expect failure
        uses: mathiasvr/command-output@v2.0.0
        with:
          run: |
            pnpm build
            ! pnpm test-storybook:ci-failures

      - name: Process test results
        if: ${{ always() }}
        id: tests
        uses: sergeysova/jq-action@v2
        with:
          cmd: 'jq .numPassedTests test-results.json -r'

      - name: Set failure check to env
        if: ${{ always() }}
        run: |
          echo "FAILED=${{ steps.tests.outputs.value > 0 }}" >> $GITHUB_ENV

      - name: Get prerelease version of Storybook
        if: ${{ always() && env.FAILED == 'true' }}
        run: |
          echo "storybook_version=$(pnpm list storybook --depth=0 | grep 'storybook@' | awk -F'@' '{print $2}')" >> $GITHUB_ENV
          echo "storybook_framework_version=$(pnpm list @storybook/react-vite --depth=0 | grep '@storybook/react-vite@' | awk -F'@' '{print $3}')" >> $GITHUB_ENV

      - name: Report if any test passes
        if: ${{ always() && env.FAILED == 'true' }}
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: '${{ secrets.SLACK_CHANNEL_ID }}'
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":storybook: :runner: [Test Runner] The Nightly check for **failures** has passed :thinking_face:",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*storybook version:*\n${{ env.prev_storybook_version }} >> ${{ env.storybook_version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*@storybook/react-vite version:*\n${{ env.prev_storybook_framework_version }} >> ${{ env.storybook_framework_version }}"
                    }
                  ],
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View failure",
                      "emoji": true
                    },
                    "value": "view_failure",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "action_id": "button-action"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
